<!-- components/movement-modal.html -->
<div id="global-movement-modal" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center backdrop-blur-sm transition-opacity opacity-0">
    <div id="global-movement-content" class="bg-slate-900 border border-gray-700 rounded-2xl w-full max-w-5xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300">
        
        <div class="bg-slate-950 px-6 py-4 border-b border-gray-800 flex justify-between items-center">
            <h3 class="text-xl font-bold text-white"><i class="fas fa-dolly text-red-500 mr-2"></i> Gestión de Movimiento</h3>
            <button onclick="closeGlobalMovementModal()" class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-times text-xl"></i></button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="space-y-6">
                <div class="bg-slate-950 p-4 rounded-xl border border-gray-800 relative">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Buscar Refacción (SKU o Nombre)</label>
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-500"></i>
                        <input type="text" id="g-scanner-input" class="w-full bg-slate-900 border border-gray-700 text-white rounded-lg pl-11 pr-4 py-3 focus:outline-none focus:border-red-500 font-mono transition-colors placeholder-gray-600" placeholder="Escanea o escribe aquí...">
                    </div>
                    <p id="g-scanner-status" class="text-xs text-gray-500 mt-2"><i class="fas fa-info-circle mr-1"></i> Presiona Enter para buscar.</p>
                </div>

                <form id="g-movement-form" class="bg-slate-950 p-5 rounded-xl border border-gray-800 space-y-5 opacity-50 pointer-events-none transition-opacity">
                    <input type="hidden" id="g-hidden-part-id">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Tipo</label>
                            <select id="g-mov-type" class="custom-select w-full" onchange="updateGlobalMovementForm()">
                                <option value="IN">ENTRADA (Recepción)</option>
                                <option value="OUT">SALIDA (Uso/Merma)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Cantidad</label>
                            <input type="number" id="g-mov-qty" min="1" class="w-full bg-slate-900 border border-gray-700 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-red-500" placeholder="0" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Clasificación</label>
                            <select id="g-mov-reason" class="custom-select w-full" required>
                                <!-- El JS se encargará de inyectar las opciones correctas aquí -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Nº Factura (POS)</label>
                            <input type="text" id="g-mov-invoice" class="w-full bg-slate-900 border border-gray-700 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-red-500 font-mono" placeholder="Opcional">
                        </div>
                    </div>

                    <div id="g-mov-photo-container" class="hidden p-4 border border-dashed border-red-900/50 rounded-xl bg-red-950/10">
                        <label class="block text-[10px] font-black text-red-500 uppercase tracking-widest mb-3"><i class="fas fa-camera mr-2"></i>Evidencia de Daño/Devolución</label>
                        <div class="flex gap-4">
                            <input type="file" id="g-mov-photo-1" accept="image/*" class="w-full text-[10px] text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer">
                            <input type="file" id="g-mov-photo-2" accept="image/*" class="w-full text-[10px] text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer" title="Foto detalle (Opcional)">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Notas / Observaciones</label>
                        <textarea id="g-mov-notes" rows="2" class="w-full bg-slate-900 border border-gray-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-red-500 resize-none text-sm placeholder-gray-600" placeholder="Detalles adicionales..."></textarea>
                    </div>

                    <button type="submit" id="g-btn-submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-red-900/20">
                        Confirmar Movimiento
                    </button>
                </form>
            </div>

            <div class="bg-slate-950 rounded-xl border border-gray-800 p-6 flex flex-col relative overflow-hidden">
                
                <div id="g-preview-empty" class="absolute inset-0 flex flex-col items-center justify-center text-gray-600 bg-slate-950 z-20 transition-opacity duration-300">
                    <i class="fas fa-barcode text-6xl mb-4 opacity-30"></i>
                    <p class="text-sm font-medium">Escanea o selecciona una refacción.</p>
                </div>

                <div id="g-preview-data" class="flex flex-col h-full opacity-0 transition-opacity duration-300">
                    
                    <div class="flex justify-between items-start mb-4">
                        <span id="g-preview-cat" class="text-[10px] font-black bg-slate-800 text-gray-300 px-2.5 py-1 rounded-full uppercase tracking-widest">---</span>
                        <div class="text-right">
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-0.5">Stock Actual</p>
                            <span id="g-preview-stock" class="text-lg font-black text-white">0</span>
                        </div>
                    </div>
                    
                    <h4 id="g-preview-name" class="text-2xl font-black text-white leading-tight mb-1">---</h4>
                    <p id="g-preview-sku" class="text-sm text-red-500 font-mono font-bold tracking-wider mb-6">SKU: ---</p>
                    
                    <div class="flex-1 bg-slate-900 rounded-xl border border-gray-800 flex items-center justify-center overflow-hidden mb-6 relative group">
                        <img id="g-preview-image" src="" alt="Refacción" class="max-h-48 object-contain transition-transform duration-500 group-hover:scale-110 hidden">
                        <i id="g-preview-no-image" class="fas fa-image text-5xl text-gray-700"></i>
                    </div>

                    <div class="grid grid-cols-2 gap-4 bg-slate-900 p-4 rounded-xl border border-gray-800">
                        <div>
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Costo Unitario</p>
                            <p id="g-preview-purchase" class="text-sm font-medium text-gray-400">$0.00</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest font-bold mb-1">Precio Público</p>
                            <p id="g-preview-sale" class="text-lg font-black text-white">$0.00</p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
