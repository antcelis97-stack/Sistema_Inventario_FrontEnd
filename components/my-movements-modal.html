<!-- components/my-movements-modal.html -->
<div id="my-movements-modal" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center backdrop-blur-sm transition-opacity opacity-0">
    <div id="my-movements-content" class="bg-slate-900 border border-gray-700 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col max-h-[85vh]">
        <div class="bg-slate-950 px-6 py-4 border-b border-gray-800 flex justify-between items-center">
            <div>
                <h3 class="text-lg font-bold text-white"><i class="fas fa-clipboard-list text-blue-500 mr-2"></i> Mis Movimientos</h3>
                <p class="text-[10px] text-gray-500 font-mono tracking-widest uppercase mt-1">Historial reciente de mi usuario</p>
            </div>
            <button onclick="closeMyMovementsModal()" class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-6">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-950 text-gray-500 uppercase text-[10px] font-black tracking-wider border-b border-gray-800">
                    <tr>
                        <th class="p-3">Fecha</th>
                        <th class="p-3">Refacción</th>
                        <th class="p-3 text-center">Cant.</th>
                        <th class="p-3">Clasificación</th>
                        <th class="p-3 text-center">Estado y Resolución</th>
                    </tr>
                </thead>
                <tbody id="my-movements-body" class="divide-y divide-gray-800 text-sm">
                    <tr><td colspan="5" class="text-center p-8 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> Cargando registros...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
