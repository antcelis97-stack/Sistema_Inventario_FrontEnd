<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores | Honda Avante</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-slate-950 text-white font-sans antialiased flex flex-col min-h-screen overflow-hidden">

    <div id="navbar-placeholder" class="h-16 w-full fixed top-0 left-0 z-50"></div>

    <div class="flex flex-1 mt-16">
        <div id="sidebar-placeholder" class="fixed top-16 left-0 w-44 h-[calc(100vh-4rem)] z-40"></div>

        <!-- FADE SLIDE UP -->
        <main class="ml-44 flex-1 p-10 bg-slate-950 h-[calc(100vh-4rem)] overflow-y-auto custom-scrollbar fade-slide-up">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-gray-800 pb-6">
                <div>
                    <h2 class="text-3xl font-bold border-l-4 border-red-600 pl-4">Directorio de Proveedores</h2>
                    <p class="text-sm text-gray-500 mt-2 font-medium tracking-wide">Lista de contactos y empresas suministradoras.</p>
                </div>
                <div class="flex gap-4 items-center">
                    <a href="catalog.html" class="text-blue-500 hover:text-blue-400 font-bold text-sm transition-colors">
                        <i class="fas fa-arrow-left mr-1"></i> Volver al Catálogo
                    </a>
                    <button id="btn-nuevo-proveedor" class="btn-3d hidden bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold transition-colors shadow-lg flex items-center gap-2 text-sm whitespace-nowrap">
                        <i class="fas fa-plus"></i> Nuevo Proveedor
                    </button>
                </div>
            </div>

            <!-- CARD 3D PARA LA TABLA -->
            <div class="card-3d bg-slate-900 border border-gray-800 rounded-xl shadow-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" id="tabla-proveedores">
                        <thead class="bg-slate-950 border-b border-gray-800 text-gray-400 text-xs uppercase tracking-wider font-bold">
                            <tr>
                                <th class="p-4">Empresa</th>
                                <th class="p-4">Contacto</th>
                                <th class="p-4">Teléfono</th>
                                <th class="p-4">Correo Electrónico</th>
                                <th class="p-4 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="lista-proveedores-body" class="divide-y divide-gray-800 text-sm text-gray-300">
                            <!-- ESQUELETOS INICIALES -->
                            <tr>
                                <td class="p-4"><div class="skeleton skeleton-title mb-0"></div></td>
                                <td class="p-4"><div class="skeleton skeleton-text short mb-0"></div></td>
                                <td class="p-4"><div class="skeleton skeleton-text short mb-0"></div></td>
                                <td class="p-4"><div class="skeleton skeleton-text short mb-0"></div></td>
                                <td class="p-4"><div class="skeleton skeleton-text short mb-0"></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL NUEVO/EDITAR PROVEEDOR -->
    <div id="modal-proveedor" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center transition-opacity opacity-0">
        <div id="modal-proveedor-content" class="bg-slate-900 border border-gray-800 rounded-2xl w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-slate-950 rounded-t-2xl">
                <h3 id="titulo-modal" class="text-xl font-bold text-white"><i class="fas fa-truck text-blue-500 mr-2"></i> Añadir Proveedor</h3>
                <button id="btn-cerrar-modal" class="text-gray-500 hover:text-red-500 transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <form id="form-proveedor" class="p-6 space-y-4" autocomplete="off">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Nombre de la Empresa *</label>
                    <input type="text" id="prov-nombre" required placeholder="Ej. COMOTO HONDA" class="w-full bg-slate-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Nombre del Contacto</label>
                    <input type="text" id="prov-contacto" placeholder="Opcional" class="w-full bg-slate-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Teléfono</label>
                    <input type="text" id="prov-telefono" placeholder="Opcional" class="w-full bg-slate-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Correo Electrónico</label>
                    <input type="email" id="prov-correo" placeholder="Opcional" class="w-full bg-slate-950 border border-gray-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                
                <div class="mt-8 flex gap-3 pt-2">
                    <button type="button" id="btn-cancelar-prov" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-colors">Cancelar</button>
                    <button type="submit" id="btn-guardar-prov" class="btn-3d flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors shadow-lg shadow-blue-900/50">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/config.js"></script> 
    <script src="../assets/js/component-loader.js"></script>
    <script src="../assets/js/providers.js"></script>
</body>
</html>
