<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos | Honda Avante</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-slate-950 text-white font-sans antialiased flex flex-col min-h-screen overflow-hidden">

    <!-- Navbar Fijo -->
    <div id="navbar-placeholder" class="h-16 w-full fixed top-0 left-0 z-50"></div>

    <!-- Contenedor Flex Principal -->
    <div class="flex flex-1 mt-16">
        
        <!-- Sidebar Fijo -->
        <div id="sidebar-placeholder" class="fixed top-16 left-0 w-44 h-[calc(100vh-4rem)] z-40"></div>

        <!-- Contenido Principal Empujado -->
        <main class="ml-44 flex-1 p-8 md:p-10 bg-slate-950 h-[calc(100vh-4rem)] overflow-y-auto custom-scrollbar">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-gray-800 pb-6">
                <div>
                    <h2 class="text-3xl font-black tracking-tight flex items-center gap-3">
                        <i class="fas fa-th-large text-red-600"></i> Catálogo Interactivo
                    </h2>
                    
                    <p class="text-gray-500 text-sm mt-1">Explora refacciones, visualiza detalles técnicos y consulta sustitutos.</p>
                </div>

                <div class="flex gap-3 w-full md:w-auto items-center">
                    <div class="relative flex-1 md:w-64">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-500"></i>
                        <input type="text" id="search-catalog" placeholder="Buscar refacción..." class="w-full bg-slate-900 border border-gray-800 rounded-lg py-2 pl-10 pr-4 text-white focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 text-sm">
                    </div>
                    
                    <div class="relative hidden md:block">
                        <select id="categoryFilter" onchange="applyFilters()" class="custom-select w-full lg:w-64">
                            <option value="all">Todas las Categorías</option>
                        </select>
                    </div>
                    
                    <button id="btn-admin-add" onclick="openCrudModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold transition-colors shadow-lg shadow-red-600/20 flex items-center gap-2 text-sm whitespace-nowrap">
                        <i class="fas fa-plus"></i> <span class="hidden sm:inline">Nueva Refacción</span>
                    </button>
                </div>
            </div>

            <!-- Contenedor dinámico de refacciones -->
            <div id="catalog-container" class="space-y-10 pb-10"></div>
            
        </main>
    </div>

    <!-- MODAL DE VISUALIZACIÓN DE PRODUCTO -->
    <div id="productModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-gray-800 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col relative shadow-2xl mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white bg-slate-800/50 hover:bg-red-600 rounded-full h-8 w-8 flex items-center justify-center transition-colors z-10">
                <i class="fas fa-times"></i>
            </button>

            <div class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="flex flex-col gap-4">
                    <div class="bg-slate-800 rounded-xl aspect-square flex items-center justify-center border border-gray-700 overflow-hidden relative group" onmouseenter="detenerCarrusel()" onmouseleave="iniciarCarrusel()">
                        <img id="main-modal-image" src="" alt="Producto" class="w-full h-full object-contain bg-slate-800 p-2 transition-transform duration-500 hidden">
                        <i id="main-modal-icon" class="fas fa-image text-8xl text-gray-600"></i>
                        
                        <button onclick="prevImage()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-red-600 text-white w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center z-10">
                            <i class="fas fa-chevron-left text-sm"></i>
                        </button>
                        <button onclick="nextImage()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-red-600 text-white w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition-all flex items-center justify-center z-10">
                            <i class="fas fa-chevron-right text-sm"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-3 gap-2 h-20" id="modal-thumbnails">
                        <div onclick="setMainImage(0)" class="thumb-item bg-slate-800 rounded-lg cursor-pointer border-2 border-transparent overflow-hidden hover:opacity-80 transition-all flex items-center justify-center relative">
                            <img id="thumb-img-0" src="" class="w-full h-full object-contain p-1 bg-slate-800 hidden">
                            <i class="fas fa-image text-gray-600" id="thumb-icon-0"></i>
                        </div>
                        <div onclick="setMainImage(1)" class="thumb-item bg-slate-800 rounded-lg cursor-pointer border-2 border-transparent overflow-hidden hover:opacity-80 transition-all flex items-center justify-center relative">
                            <img id="thumb-img-1" src="" class="w-full h-full object-contain p-1 bg-slate-800 hidden">
                            <i class="fas fa-image text-gray-600" id="thumb-icon-1"></i>
                        </div>
                        <div onclick="setMainImage(2)" class="thumb-item bg-slate-800 rounded-lg cursor-pointer border-2 border-transparent overflow-hidden hover:opacity-80 transition-all flex items-center justify-center relative">
                            <img id="thumb-img-2" src="" class="w-full h-full object-contain p-1 bg-slate-800 hidden">
                            <i class="fas fa-image text-gray-600" id="thumb-icon-2"></i>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <span id="modal-category" class="text-xs text-red-500 font-bold tracking-widest uppercase mb-1">Categoría</span>
                            <h2 id="modal-title" class="text-2xl font-black text-white mb-1 leading-tight">Nombre del Producto</h2>
                            <p id="modal-sku" class="text-sm text-gray-400 font-mono">SKU: ---</p>
                        </div>
                        <button id="btn-edit-modal" class="bg-slate-800 hover:bg-slate-700 text-blue-400 border border-slate-600 px-4 py-2 rounded-lg transition-colors flex items-center gap-2 text-sm font-bold shrink-0 hidden shadow-sm">
                            <i class="fas fa-edit"></i> Editar
                        </button>
                    </div>

                    <div class="bg-slate-800/50 border border-gray-700/50 rounded-xl p-4 mb-6 grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Proveedor</p>
                            <p id="modal-provider" class="text-sm font-medium text-white">---</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Existencias</p>
                            <p id="modal-stock" class="text-sm font-bold text-green-400">---</p>
                        </div>
                        <div class="col-span-2">
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Descripción</p>
                            <p id="modal-desc" class="text-xs text-gray-300 leading-relaxed">---</p>
                        </div>
                    </div>

                    <div class="mt-auto">
                        <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                            <i class="fas fa-random text-gray-500"></i> Sustitutos Compatibles
                        </h3>
                        <div id="modal-substitutes" class="space-y-2"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="global-modal-placeholder"></div>
    <div id="support-modal-placeholder"></div>
    <div id="sparepart-modal-placeholder"></div>
    <div id="my-movements-modal-placeholder"></div>

    <script src="../assets/js/component-loader.js"></script>
    <script src="../assets/js/movement-modal.js"></script>
    <script src="../assets/js/sparepart-modal.js"></script>
    <script src="../assets/js/catalog.js"></script>
</body>
</html>
