<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorizaciones | Honda Avante</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-slate-950 text-white font-sans antialiased flex flex-col min-h-screen overflow-hidden" data-admin-only="true">

    <div id="navbar-placeholder" class="h-16 w-full fixed top-0 left-0 z-50"></div>

    <div class="flex flex-1 mt-16">
        <div id="sidebar-placeholder" class="fixed top-16 left-0 w-42 h-[calc(100vh-4rem)] z-40"></div>

        <main class="ml-48 flex-1 p-8 lg:p-10 bg-slate-950 h-[calc(100vh-4rem)] overflow-y-auto">
            
            <div class="mb-8 border-b border-gray-800 pb-6 flex flex-col md:flex-row md:justify-between md:items-end gap-6">
                <div>
                    <h2 class="text-3xl font-bold border-l-4 border-red-600 pl-4">Centro de Autorizaciones</h2>
                    <p class="text-sm text-gray-500 mt-2 font-medium tracking-wide">Gestión de mermas, daños y devoluciones a proveedor.</p>
                </div>
                
                <div class="flex bg-slate-900 rounded-lg p-1 border border-gray-800 shadow-inner overflow-x-auto no-scrollbar">
                    <button id="tab-approvals" onclick="switchTab('approvals')" class="px-6 py-2.5 rounded-md bg-red-600 text-white font-bold text-sm shadow-md transition-all flex items-center whitespace-nowrap">
                        <i class="fas fa-clipboard-check mr-2"></i> Por Aprobar
                    </button>
                    <button id="tab-provider" onclick="switchTab('provider')" class="px-6 py-2.5 rounded-md text-gray-400 hover:text-white font-bold text-sm transition-all flex items-center whitespace-nowrap">
                        <i class="fas fa-truck-loading mr-2"></i> En Espera (Proveedor)
                    </button>
                    <!-- NUEVA PESTAÑA -->
                    <button id="tab-rejected" onclick="switchTab('rejected')" class="px-6 py-2.5 rounded-md text-gray-400 hover:text-white font-bold text-sm transition-all flex items-center whitespace-nowrap">
                        <i class="fas fa-ban mr-2"></i> Rechazados
                    </button>
                </div>
            </div>

            <div id="approvals-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-500">
                    <i class="fas fa-spinner fa-spin text-4xl mb-4 text-red-600"></i>
                    <p class="font-medium tracking-wide">Cargando bandeja de pendientes...</p>
                </div>
            </div>

        </main>
    </div>

    <div id="image-viewer-modal" class="fixed inset-0 bg-black/95 hidden z-[100] flex flex-col items-center justify-center backdrop-blur-md transition-opacity opacity-0">
        <div id="image-viewer-content" class="relative max-w-5xl w-full p-4 scale-95 transition-transform flex flex-col items-center">
            <button onclick="animateModal('image-viewer-modal', 'image-viewer-content', false)" class="absolute -top-10 right-4 text-gray-400 hover:text-red-500 text-4xl hover:rotate-90 transition-all">
                <i class="fas fa-times"></i>
            </button>
            
            <img id="evidence-image-src" src="" alt="Evidencia del Operador" class="max-h-[75vh] max-w-full object-contain rounded-xl shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-gray-800">
            
            <a id="photo-download-btn" href="#" download class="mt-6 bg-slate-800 hover:bg-slate-700 text-white px-8 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 border border-gray-700 transition-colors">
                <i class="fas fa-download"></i> Descargar Evidencia
            </a>
        </div>
    </div>

    <div id="resolve-modal" class="fixed inset-0 bg-black/80 hidden z-[90] flex items-center justify-center backdrop-blur-sm transition-opacity opacity-0">
        <div id="resolve-content" class="bg-slate-900 border border-gray-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="bg-blue-900/20 px-6 py-4 border-b border-gray-800 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white"><i class="fas fa-handshake text-blue-500 mr-2"></i> Resolución del Proveedor</h3>
                <button onclick="closeResolveModal()" class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="p-6 space-y-5">
                <input type="hidden" id="resolve-mov-id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">¿Cómo resolvió Honda el caso?</label>
                    <select id="filter-type" onchange="applyMovementFilters()" class="custom-select w-full sm:w-auto">
                        <option value="replace_same">Devolución Correcta (Sumar Pieza al Stock)</option>
                        <option value="refund">Reembolso Económico Total (No sumar Stock)</option>
                    </select>
                </div>

                <div id="qty-container" class="bg-blue-900/10 border border-blue-900/30 p-4 rounded-xl">
                    <label class="block text-xs font-bold text-blue-400 uppercase tracking-wider mb-2">Cantidad recibida físicamente</label>
                    <input type="number" id="resolve-qty" min="1" class="w-full bg-slate-950 border border-gray-800 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 font-bold">
                    <p class="text-[10px] text-gray-500 mt-2"><i class="fas fa-info-circle mr-1"></i> Originalmente se enviaron: <span id="resolve-original-qty" class="font-bold text-white">0</span> piezas.</p>
                </div>

                <div id="refund-container" class="bg-emerald-900/10 border border-emerald-900/30 p-4 rounded-xl hidden">
                    <div class="mb-4">
                        <label class="block text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">Monto Reembolsado ($)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 font-bold">$</span>
                            <input type="number" step="0.01" id="resolve-amount" class="w-full bg-slate-950 border border-gray-800 text-white rounded-lg pl-8 pr-4 py-3 focus:outline-none focus:border-emerald-500 font-bold" placeholder="0.00">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">Folio / Nota de Crédito</label>
                        <input type="text" id="resolve-folio" class="w-full bg-slate-950 border border-gray-800 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-emerald-500 font-bold placeholder-gray-600" placeholder="Ej. NC-987654">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Notas / Resolución final</label>
                    <textarea id="resolve-notes" rows="3" class="w-full bg-slate-950 border border-gray-800 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 resize-none text-sm placeholder-gray-600" placeholder="Ej. Mandaron 3 piezas y reembolsaron 2. Guía #1234..."></textarea>
                </div>

                <button onclick="submitResolution()" id="btn-submit-resolution" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-colors shadow-lg shadow-blue-900/20 flex items-center justify-center">
                    Cerrar Caso Definitivamente
                </button>
            </div>
        </div>
    </div>

    <div id="global-modal-placeholder"></div>
    <div id="support-modal-placeholder"></div>
    <div id="my-movements-modal-placeholder"></div>

    <script src="../assets/js/component-loader.js"></script>
    <script src="../assets/js/approvals.js"></script>
</body>
</html>
