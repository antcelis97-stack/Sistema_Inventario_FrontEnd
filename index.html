<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Empresarial | Honda Avante</title>
    <script src="assets/js/config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.6s ease-out forwards; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }

        .bg-banner {
            background-image: url('assets/img/sistema/banner.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans antialiased h-screen overflow-hidden">

    <div class="h-full flex flex-col md:flex-row relative">

        <div class="hidden md:flex md:w-3/5 lg:w-2/3 bg-banner relative shadow-[10px_0_30px_rgba(0,0,0,0.8)] z-10">
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-transparent to-slate-950/90"></div>
        </div>

        <div class="w-full md:w-2/5 lg:w-1/3 flex flex-col items-center justify-center p-8 lg:p-12 bg-slate-950 relative overflow-hidden z-20">

            <div class="absolute top-[-5%] right-[-10%] w-96 h-96 bg-red-600/10 rounded-full blur-[100px] pointer-events-none"></div>

            <div class="w-full max-w-sm relative z-30 flex flex-col h-full justify-center">

                <div class="text-center mb-8">
                    <h1 class="text-4xl md:text-5xl font-black tracking-tighter flex items-center justify-center gap-3">
                        <img src="assets/img/sistema/logo.png" alt="HONDA AVANTE" class="h-12 w-12">
                        HONDA <span class="text-red-600 font-light">AVANTE</span>
                    </h1>
                    <br>
                    <div class="flex items-center justify-center gap-6 mt-4 mb-3 text-red-600 text-3xl">
                        <i class="fas fa-motorcycle drop-shadow-[0_0_15px_rgba(220,38,38,0.5)]"></i>
                        <i class="fas fa-car drop-shadow-[0_0_15px_rgba(220,38,38,0.5)]"></i>
                    </div>
                    <p class="text-gray-400 tracking-widest uppercase text-[9px] font-semibold">
                        Portal Corporativo de Servicios v3.0
                    </p>
                </div>

                <div id="portalMenuContainer" class="w-full transition-all duration-500">
                    
                    <div id="welcomeMessage" class="mb-6 text-center hidden">
                        <p class="text-lg text-gray-300 mb-1">Bienvenido,</p>
                        <p id="portalUserName" class="text-3xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-300 font-black"></p>
                    </div>

                    <div class="flex flex-col gap-4">
                        <button onclick="accessModule('pages/main.html')" class="w-full bg-slate-900 border border-gray-800 p-5 rounded-2xl hover:border-red-500 hover:bg-slate-800 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_30px_-10px_rgba(220,38,38,0.2)] group flex items-center text-left animate-fade-up delay-100">
                            <div class="h-14 w-14 flex-shrink-0 bg-red-500/10 rounded-xl flex items-center justify-center text-red-500 text-xl mr-5 group-hover:scale-110 transition-transform group-hover:bg-red-500 group-hover:text-white">
                                <i class="fas fa-boxes"></i>
                            </div>
                            <div>
                                <h3 class="text-base font-bold mb-1 group-hover:text-red-400 transition-colors text-white">Panel de Control</h3>
                                <p class="text-[11px] text-gray-500 leading-relaxed">Inventario, movimientos y reportes.</p>
                            </div>
                        </button>

                        <button onclick="openPortalSupportModal()" class="w-full bg-slate-900 border border-gray-800 p-5 rounded-2xl hover:border-emerald-500 hover:bg-slate-800 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_10px_30px_-10px_rgba(16,185,129,0.2)] group flex items-center text-left animate-fade-up delay-200">
                            <div class="h-14 w-14 flex-shrink-0 bg-emerald-500/10 rounded-xl flex items-center justify-center text-emerald-500 text-xl mr-5 group-hover:scale-110 transition-transform group-hover:bg-emerald-500 group-hover:text-white">
                                <i class="fas fa-headset"></i>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-white mb-1 group-hover:text-emerald-400 transition-colors">Soporte Técnico</h3>
                                <p class="text-[11px] text-gray-500 leading-relaxed">Contacto directo con desarrollo.</p>
                            </div>
                        </button>
                    </div> <button onclick="logout()" id="portalLogoutBtn" class="mt-8 w-full flex items-center justify-center gap-2 text-xs text-gray-500 hover:text-red-500 transition-colors px-4 py-3 rounded-xl hover:bg-red-500/10 hidden">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión Segura
                    </button>
                    
                </div>
                    </div>
            </div>

            <!-- MODAL FLOTANTE DE LOGIN (Oculto por defecto, aparece sobre el panel derecho) -->
            <div id="loginModal" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col justify-center items-center p-8 hidden opacity-0 translate-y-10 transition-all duration-500">
                
                <!-- Botón para cancelar/cerrar la tarjeta de login -->
                <button onclick="closeLoginModal()" class="absolute top-8 right-8 text-gray-600 hover:text-red-500 transition-colors">
                    <i class="fas fa-times text-2xl"></i>
                </button>

                <div class="w-full max-w-sm bg-slate-900 border border-gray-800 p-8 rounded-3xl shadow-2xl">
                    
                    <!-- NUEVO: Ícono de Usuario -->
                    <div class="flex justify-center mb-5">
                        <div class="h-16 w-16 bg-slate-950 border border-gray-800 rounded-full flex items-center justify-center text-red-600 text-2xl shadow-[0_0_20px_rgba(220,38,38,0.15)]">
                            <i class="fas fa-user-lock"></i>
                        </div>
                    </div>

                    <div class="text-center mb-6">
                        <h2 class="text-xl font-bold text-white tracking-tight">Acceso Restringido</h2>
                        <p class="text-xs text-gray-500 mt-1" id="loginSubtitle">Identifícate para ingresar al módulo</p>
                    </div>

                    <!-- FORMULARIO BLINDADO CONTRA AUTOCOMPLETADO -->
                    <form id="loginForm" class="space-y-5" autocomplete="off">
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Correo Electrónico</label>
                            <div class="relative group">
                                <i class="fas fa-envelope absolute left-4 top-3.5 text-gray-500 group-focus-within:text-red-500 transition-colors"></i>
                                <input type="email" id="email" required autocomplete="off" class="w-full bg-slate-950 border border-gray-800 rounded-xl py-3 pl-12 pr-4 text-white focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition-all text-sm" placeholder="ejemplo@honda.com">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-2 ml-1">Contraseña</label>
                            <div class="relative group">
                                <i class="fas fa-key absolute left-4 top-3.5 text-gray-500 group-focus-within:text-red-500 transition-colors"></i>
                                
                                <input type="password" id="password" required autocomplete="new-password" class="w-full bg-slate-950 border border-gray-800 rounded-xl py-3 pl-12 pr-12 text-white focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition-all text-sm" placeholder="••••••••">
                                
                                <!-- Botón para ver/ocultar contraseña -->
                                <button type="button" id="togglePasswordBtn" class="absolute right-4 top-3.5 text-gray-500 hover:text-red-500 transition-colors focus:outline-none">
                                    <i class="fas fa-eye" id="togglePasswordIcon"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" id="btnLogin" class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-3.5 rounded-xl mt-4 transition-all hover:shadow-[0_5px_20px_rgba(220,38,38,0.4)] flex justify-center items-center gap-3">
                            <span class="tracking-wide text-sm">Ingresar</span> <i class="fas fa-sign-in-alt"></i>
                        </button>
                        <p id="statusMessage" class="text-center text-xs font-medium mt-4 hidden bg-slate-950 p-3 rounded-lg border border-gray-800"></p>
                    </form>
                </div>
            </div>

        </div>
    </div>
    <div id="support-modal-placeholder"></div>
    <script src="assets/js/login.js"></script> 
</body>
</html>
